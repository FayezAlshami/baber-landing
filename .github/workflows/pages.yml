name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Reads the Pages settings: base_path is "/<repo>" on github.io and "" once a custom
      # domain (barber.fayezalshami.com) is set, and base_url follows suit. The build adapts by itself.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Prepare static export
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          Path("src").mkdir(exist_ok=True)
          Path("src/image-loader.js").write_text(
              """export default function imageLoader({ src }) {
            const base = process.env.NEXT_PUBLIC_BASE_PATH || "";
            if (src.startsWith("http://") || src.startsWith("https://")) return src;
            if (base && src.startsWith(`${base}/`)) return src;
            const path = src.startsWith("/") ? src : `/${src}`;
            return `${base}${path}`;
          }
          """,
              encoding="utf-8",
          )
          Path("next.config.mjs").write_text(
              """const basePath = process.env.NEXT_PUBLIC_BASE_PATH ?? "";
          export default {
            reactStrictMode: true,
            output: "export",
            trailingSlash: true,
            images: {
              unoptimized: true,
              loader: "custom",
              loaderFile: "./src/image-loader.js",
            },
            basePath,
            assetPrefix: basePath,
          };
          """,
              encoding="utf-8",
          )
          PY

      - name: Static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Prefix leftover public assets
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          base = os.environ["BASE"].rstrip("/")
          roots = ("/img/", "/brand/")
          for path in Path("out").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              for attr in ("src", "href"):
                  for root in roots:
                      text = text.replace(f'{attr}="{root}', f'{attr}="{base}{root}')
                      text = text.replace(f"{attr}='{root}", f"{attr}='{base}{root}")
              path.write_text(text, encoding="utf-8")
          Path("out/.nojekyll").touch()
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
